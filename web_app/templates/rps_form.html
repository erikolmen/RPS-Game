{% extends "bootstrap_5_layout.html" %}
{% set active_page = "rps_form" %}

{% block content %}

    <h2>Rock, Paper, Scissors</h2>

    <p>Choose your move, then click the button to play against the computer.</p>

    <form action="/rps/results" method="POST" style="max-width: 320px;">

        <label for="user_choice" class="form-label">Your Choice:</label>
        <select class="form-select mb-3" id="user_choice" name="user_choice">
            {% for option in options %}
                <option value="{{ option }}">{{ option | title }}</option>
            {% endfor %}
        </select>

        <button class="btn btn-success">Play</button>
    </form>

{% endblock %}
