<!-- shared scoreboard, included on the RPS form and results pages -->
<div class="text-center">
    <div class="small text-body-secondary text-uppercase fw-semibold mb-2">Your Score</div>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
        <span class="badge rounded-pill text-bg-success fs-6">Wins: {{ score.user }}</span>
        <span class="badge rounded-pill text-bg-danger fs-6">Losses: {{ score.computer }}</span>
        <span class="badge rounded-pill text-bg-secondary fs-6">Ties: {{ score.tie }}</span>
    </div>
    <form action="/rps/reset" method="POST" class="mt-2">
        <button class="btn btn-link btn-sm text-body-secondary">Reset score</button>
    </form>
</div>
